version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartled_mysql_jredaled
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartled_jreda2
      MYSQL_USER: smartled_userge
      MYSQL_PASSWORD: greenenergy@201310
    ports:
      - "3306:3306"
    volumes:
      - mysql_jredaled_data:/var/lib/mysql
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_jredaled_data:
